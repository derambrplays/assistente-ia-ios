name: AssistenteIA
options:
  bundleIdPrefix: com.assistenteia
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  AssistenteIA:
    type: application
    platform: iOS
    sources:
      - path: AssistenteIA
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assistenteia.app
        PRODUCT_NAME: AssistenteIA
        INFOPLIST_FILE: AssistenteIA/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: NO
        GENERATE_INFOPLIST_FILE: NO

schemes:
  AssistenteIA:
    build:
      targets:
        AssistenteIA: all
    run:
      config: Debug
    archive:
      config: Release
