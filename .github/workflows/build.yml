name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar app (sem assinatura)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o XcodeGen
        run: brew install xcodegen

      - name: Gerar o projeto Xcode
        run: xcodegen generate

      - name: Compilar
        run: |
          set -o pipefail
          xcodebuild \
            -project AssistenteIA.xcodeproj \
            -scheme AssistenteIA \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empacotar o IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AssistenteIA.app Payload/
          zip -qry AssistenteIA.ipa Payload

      - name: Disponibilizar o download
        uses: actions/upload-artifact@v4
        with:
          name: AssistenteIA-ipa
          path: AssistenteIA.ipa
          if-no-files-found: error
          retention-days: 30
